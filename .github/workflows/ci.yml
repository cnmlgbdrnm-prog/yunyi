# CI 门禁：rust job——fetch:sidecar → fmt → clippy；frontend job——npm ci → 各项检查；
# commitlint job——提交信息与 PR 标题规范。push 与 PR 双触发，任一红不可合并。
# 测试源码集中放在仓库根 tests/（前端 tests/frontend、Rust tests/rust），已加入
# .gitignore，不随源码上传；CI 检出里没有这些文件，故 CI 不再运行 cargo test / vitest，
# 测试只在本地执行（见 README「测试」节）。
# 详见 docs/superpowers/specs/2026-08-14-vpn-ctl-p6-ci-design.md。
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # mihomo sidecar：tauri-build 校验 bundle.resources 存在性，cargo 命令必须先行落盘。
      # 脚本幂等（已存在且哈希匹配即跳过），windows runner 上 powershell 解压路径可用。
      - name: 获取 mihomo sidecar
        run: npm run fetch:sidecar
        working-directory: .
      - name: 获取 Tor Expert Bundle
        run: npm run fetch:tor
        working-directory: .
      - name: 校验打包资源
        run: npm run check:package
        working-directory: .
      - name: cargo fmt
        run: cargo fmt --check
      # 不带 local-tests 特性：测试源码不在仓库里，cfg 门控会把所有测试模块剥离。
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      # 敏感信息护栏：真实主机 IP 与凭据不得进入版本库（白名单见
      # scripts/sensitive-allowlist.txt）。
      - name: sensitive check
        run: npm run check:sensitive
      # 代码规模硬规范：UI 组件 ≤500 行、单文件 ≤1500 行（docs/ 与生成物不计）。
      - name: code size check
        run: npm run check:size
      # 项目组织规范：文档必须分层进 docs/<分类>/、根目录白名单、文档死链、
      # src/ 顶层只放入口、views 不得互相引用（scripts/check-organization.mjs）。
      - name: organization check
        run: npm run check:org
      # 只检查 src：tsconfig.json 不含 tests/frontend（测试源码不随源码上传），
      # 本地要连测试一起检查时用 npm run test:typecheck。
      - name: tsc
        run: npx tsc --noEmit -p tsconfig.json
      # updater 发布配置回归护栏（scripts/check-updater-pubkey.mjs）：
      # 1. pubkey 须为公钥盒全文的 base64（CLI 与插件的 decode 链要求），
      #    裸密钥行会让 tauri build 报「failed to decode base64 pubkey」
      #    （2026-08-14 release 首次暴露）
      # 2. bundle.createUpdaterArtifacts 必须为 true——误改 false 后安装包
      #    不生成 .sig，发布会缺 latest.json，客户端检查更新停在旧版
      #    （2026-08-15 0.2.2 首轮构建实际发生）
      - name: updater 发布配置检查
        run: npm run check:updater-pubkey

  # 提交信息规范：首行必须是 Conventional Commits（type(scope): 描述）；
  # 正文/脚注是自由纯文本，不要求 Markdown（规则见 commitlint.config.mjs）。
  # PR 校验 base..head 的全部提交；push 只校验最新一条。合并提交默认忽略。
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      - name: 校验 PR 提交信息
        if: github.event_name == 'pull_request'
        run: >-
          npx commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose
      - name: 校验 push 提交信息
        if: github.event_name == 'push'
        run: git log -1 --pretty=%B | npx commitlint --verbose
      # squash 合并使用 PR 标题作为提交信息，标题也必须符合规范。
      - name: 校验 PR 标题
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # PR 失败提醒：CI 红了就在 PR 里 @ 作者并列出失败步骤；变绿后把同一条评论更新为通过。
  # 只在 PR 上运行（直接 push 到 master 由 GitHub Actions 自身通知触发者）。
  # 评论失败（如 fork PR 的只读 token）不改变门禁结果。
  ci-notice:
    name: ci notice
    needs: [rust, frontend, commitlint]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: 更新 PR 检查结果评论
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          COMMITLINT_RESULT: ${{ needs.commitlint.result }}
        with:
          script: |
            const marker = '<!-- ci-notice -->'
            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = context.issue.number
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const allPassed = [
              process.env.RUST_RESULT,
              process.env.FRONTEND_RESULT,
              process.env.COMMITLINT_RESULT,
            ].every((r) => r === 'success')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            )

            if (allPassed) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id,
                  body: `${marker}\n✅ **CI 已通过**（[本次运行](${runUrl})）`,
                })
              }
              return
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, per_page: 100,
            })
            const failed = jobs.filter(
              (j) => j.conclusion === 'failure' || j.conclusion === 'timed_out',
            )
            // 取消/跳过的运行不误报。
            if (failed.length === 0) return

            const lines = failed.map((j) => {
              const steps = (j.steps || [])
                .filter((s) => s.conclusion === 'failure' || s.conclusion === 'timed_out')
                .map((s) => '`' + s.name + '`')
              return `- **${j.name}**${steps.length ? '：' + steps.join('、') : ''}`
            })
            const author = context.payload.pull_request.user.login
            const body = [
              marker,
              '❌ **CI 未通过**',
              '',
              ...lines,
              '',
              `@${author} 请修复后重新推送；全部必需检查通过后合并按钮才会解锁。`,
              '',
              `[查看本次运行](${runUrl})`,
            ].join('\n')

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
